<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MovieApp</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>🎬 MovieApp</h1>
    <nav id="nav"></nav>
  </header>

  <main>
    <section id="featured-section" hidden>
      <h2>Featured on Homepage</h2>
      <div id="featured-grid" class="grid"></div>
    </section>

    <section>
      <h2>Find a Movie</h2>
      <form id="search-form" class="search-bar">
        <input id="search-input" type="text" placeholder="Search movie title..." />
        <button type="submit">Search</button>
      </form>
      <p id="results-label" class="muted">Popular right now</p>
      <div id="results-grid" class="grid"></div>
    </section>
  </main>

  <script type="module" src="/js/home.js"></script>
</body>
</html>
