<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <h1>🎬 MovieApp</h1>
    <nav id="nav"></nav>
  </header>

  <main>
    <h2>Create an account</h2>
    <form id="register-form" class="stacked">
      <input id="username" type="text" placeholder="Username" required />
      <input id="email" type="email" placeholder="Email" required />
      <input id="password" type="password" placeholder="Password (min. 6 characters)" minlength="6" required />
      <button type="submit">Register</button>
      <p id="error" class="error" hidden></p>
    </form>
    <p class="muted">Already have an account? <a href="/pages/login.html">Login here</a>.</p>
  </main>

  <script type="module" src="/js/register.js"></script>
</body>
</html>
